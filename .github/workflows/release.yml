name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows App
        run: npm run dist:win -- --publish never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.7z
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || true
      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/tigermusic-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build-output/*.apk
          if-no-files-found: warn

  create-release:
    name: Create Release
    needs: [build-win, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: artifacts/android

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取当前最新的 tag
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Current tag: $CURRENT_TAG"
          # 使用 GitHub API 直接获取所有 release 的 tag 列表
          TAGS=$(gh release list --limit 100 --json tagName -q '.[].tagName' || true)
          if [ -z "$TAGS" ]; then
            echo "No releases found."
            exit 0
          fi
          for tag in $TAGS; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "Failed to delete $tag"
            fi
          done

      - name: Delete old workflow runs & artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除 30 天前的旧 workflow runs（连同其 artifacts 一起清理）
          cutoff=$(date -u -d "30 days ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-30d +%Y-%m-%dT%H:%M:%SZ)
          gh run list --limit 100 --json databaseId,createdAt,status -q ".[] | select(.createdAt < \"$cutoff\") | .databaseId" | while read rid; do
            if [ -n "$rid" ]; then
              echo "Deleting old run: $rid"
              gh run delete "$rid" || true
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/android/*.apk
          generate_release_notes: true

